[package]
name = "ferroid"
version.workspace = true
rust-version = "1.89.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
description = "High-performance ULID and Snowflake-style IDs. Unique, monotonic, and lexicographically sortable IDs optimized for low-latency services and async workloads."
repository = "https://github.com/s0l0ist/ferroid/blob/main/crates/ferroid"
categories = [
  "data-structures",    # Exposes structured types like ULID, SnowflakeId, etc.
  "encoding",           # Optional Base32 support (Crockford-style)
  "asynchronous",       # If using async stream generation features
  "no-std",             # Supports no_std-compatible environments
  "development-tools"   # Broad utility for developers building systems
]
documentation.workspace = true
keywords = ["no_std", "id", "snowflake", "ulid", "monotonic"]

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib"]

[dependencies]
crossbeam-utils = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
portable-atomic = { workspace = true, optional = true }
rand = { workspace = true, optional = true, features = ["thread_rng"] }
serde = { workspace = true, optional = true, features = ["derive"] }
tracing = { workspace = true, optional = true, features = ["attributes"] }

[target.wasm32-unknown-unknown.dependencies]
web-time = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["alloc"] }
futures = { workspace = true, features = ["alloc"] }

[features]
default = ["intrinsics"]
# Functional preset; tuning and instrumentation remain explicit opt-ins.
all = [
  "std", "alloc", "snowflake", "ulid", "basic", "atomic", "lock", "base32", "futures", "serde",
  "thread-rng", "thread-local",
]

# Independent API capabilities.
alloc = ["serde?/alloc"]
std = ["serde?/std", "tracing?/std", "dep:web-time"]

# Generator backends provide generators for enabled ID families.
snowflake = []
ulid = []
basic = []
atomic = ["dep:portable-atomic", "dep:crossbeam-utils"]
lock = ["std", "alloc", "dep:crossbeam-utils"]

# Optional thread-local randomness.
thread-rng = ["std", "dep:rand"]
thread-local = ["std", "alloc", "ulid", "basic", "thread-rng"]

# Integrations also work without std or allocation.
base32 = []
futures = []
serde = ["dep:serde"]

# Optional tuning and instrumentation.
intrinsics = []
parking-lot = ["lock", "std", "alloc", "dep:parking_lot"]
tracing = ["dep:tracing"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
