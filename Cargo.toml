[workspace]
resolver = "3"
members = [
    "crates/ferroid",
    "crates/ferroid-benches",
    "crates/ferroid-feature-tests",
    "crates/ferroid-tonic-core",
    "crates/ferroid-tonic-server",
    "crates/ferroid-tonic-server-benches",
    "crates/pg-ferroid",
]
default-members = [
    "crates/ferroid",
    "crates/ferroid-tonic-core",
    "crates/ferroid-tonic-server",
]

[workspace.package]
version = "3.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
authors = ["Nick Angelou <angelou.nick@gmail.com>"]
documentation = "https://docs.rs/ferroid"

[workspace.dependencies]
anyhow = { version = "1.0", default-features = false }
bytes = { version = "1.12", default-features = false }
clap = { version = "4.6", default-features = false }
criterion = { version = "0.8", default-features = false }
crossbeam-utils = { version = "0.8", default-features = false }
dotenvy = { version = "0.15", default-features = false }
futures = { version = "0.3", default-features = false }
mimalloc = { version = "0.1", default-features = false }
opentelemetry = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false }
opentelemetry-semantic-conventions = { version = "0.33", default-features = false }
opentelemetry-stdout = { version = "0.33", default-features = false }
opentelemetry_sdk = { version = "0.33", default-features = false }
parking_lot = { version = "0.12", default-features = false }
pgrx = { version = "0.20", default-features = false }
pgrx-tests = { version = "0.20", default-features = false }
portable-atomic = { version = "1.15", default-features = false }
prost = { version = "0.14", default-features = false }
rand = { version = "0.10", default-features = false }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
shlex = { version = "2.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.54", default-features = false }
tokio-stream = { version = "0.1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tonic = { version = "0.14", default-features = false }
tonic-health = { version = "0.14", default-features = false }
tonic-prost = { version = "0.14", default-features = false }
tonic-prost-build = { version = "0.14", default-features = false }
tonic-reflection = { version = "0.14", default-features = false }
tonic-web = { version = "0.14", default-features = false }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.7", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
web-time = { version = "1.1", default-features = false }

[profile.bin-release]
inherits = "release"
codegen-units = 1           # Reduce binary size and improve optimization.
debug = "full"              # Retain debug information for release diagnostics.
lto = true                  # Reduce binary size and improve optimization.
opt-level = 3               # Optimize for runtime performance.
panic = "unwind"            # Unwind the stack so destructors can run.
split-debuginfo = "packed"  # Keep debug information separate from the stripped binary.
strip = "symbols"           # Strip symbols after separating debug information.
incremental = true          # Reuse compilation work on subsequent builds.
