name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # allow manual triggers
  workflow_dispatch: {}

permissions:
  contents: read

# Cancel superseded PR runs; let push and manual runs finish independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Check each ID family's feature configurations on MSRV and stable Rust.
  features:
    name: Feature tests (Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.99.1", stable]
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Test Snowflake features
        run: cargo hack test -p ferroid --locked --each-feature --features snowflake

      - name: Test ULID features
        run: cargo hack test -p ferroid --locked --each-feature --features ulid

      - name: Build library documentation
        run: cargo doc -p ferroid --locked --all-features --no-deps

  # Exercise both scalar and native Base32 implementations on each architecture.
  base32-backends:
    name: Base32 (scalar + ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: NEON
            os: ubuntu-24.04-arm
            rustflags: ""
          - backend: SSSE3
            os: ubuntu-24.04
            rustflags: "-C target-feature=+ssse3"
    env:
      # SSSE3 stays enabled for the scalar test to verify the intrinsics opt-out.
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test scalar Base32
        run: >-
          cargo test -p ferroid --lib --locked
          --no-default-features --features base32,snowflake,ulid

      - name: Test ${{ matrix.backend }} Base32
        run: >-
          cargo test -p ferroid --lib --locked
          --no-default-features --features base32,snowflake,ulid,intrinsics

  # Test the default workspace members: ferroid and both gRPC crates.
  # pg-ferroid requires a separate PostgreSQL/pgrx test environment.
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test library preset and default server features
        run: cargo test --locked --features all

      - name: Test workspace crates and features
        run: cargo test --locked --all-features
