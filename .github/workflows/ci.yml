name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # allow manual triggers
  workflow_dispatch: {}

permissions:
  contents: read

# Cancel superseded PR runs; let push and manual runs finish independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-24.04-arm
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test library documentation
        run: cargo test -p ferroid --locked --all-features --doc

      - name: Build library documentation
        run: cargo doc -p ferroid --locked --all-features --no-deps

  base32-backends:
    name: Base32 (${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: NEON
            os: ubuntu-24.04-arm
            rustflags: ""
          - backend: SSSE3
            os: ubuntu-24.04
            rustflags: "-C target-feature=+ssse3"
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test ${{ matrix.backend }} Base32
        run: >-
          cargo test -p ferroid --lib --locked
          --features snowflake,ulid,alloc,base32

  # Test the default workspace members: ferroid and both gRPC crates.
  # pg-ferroid requires a separate PostgreSQL/pgrx test environment.
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test workspace crates and features
        run: cargo test --locked --all-features
